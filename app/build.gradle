plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation project(':core')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation testFixtures(project(':core'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'io.github.cyson21.reservation.ReservationApplication'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags('postgres')
    }
}

tasks.register('postgresTest', Test) {
    description = 'Runs adapter contract and concurrency tests against a PostgreSQL database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags('postgres')
    }
    // Always execute against the database configured for this invocation.
    outputs.upToDateWhen { false }
}
